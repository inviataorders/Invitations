<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Zoha & Fahed Invitation</title>
  <style>
    :root {
      --vh: 1vh;
      --ivory: rgba(255,250,241,0.985);
      --panel-shadow: 0 24px 70px rgba(12,23,38,0.16);
      --glow: 0 0 14px rgba(255,247,231,0.16), 0 0 26px rgba(255,242,210,0.08);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      -webkit-text-size-adjust: 100%;
    }
    body {
      font-family: "Times New Roman", Georgia, serif;
      color: var(--ivory);
      background: #000;
    }
    button, a, div, iframe { -webkit-tap-highlight-color: transparent; }
    .app {
      width: 100%;
      height: calc(var(--vh) * 100);
      overflow: hidden;
      position: relative;
      background: #000;
    }
    .intro {
      position: absolute;
      inset: 0;
      background: #000;
      overflow: hidden;
      z-index: 20;
    }
    .intro.hidden { display: none; }
    .intro video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }
    .intro::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.08), rgba(0,0,0,0.24));
      pointer-events: none;
    }
    .open-overlay {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }
    .open-wrap {
      position: absolute;
      top: 41%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(86vw, 340px);
      display: flex;
      justify-content: center;
      pointer-events: auto;
    }
    .open-btn {
      appearance: none;
      border: 1px solid rgba(255,255,255,0.56);
      background: rgba(255,255,255,0.14);
      color: rgba(255,250,244,0.98);
      padding: 16px 30px;
      min-width: 220px;
      min-height: 56px;
      border-radius: 999px;
      font-size: clamp(18px, 2.8vw, 24px);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      backdrop-filter: blur(14px) saturate(140%);
      -webkit-backdrop-filter: blur(14px) saturate(140%);
      box-shadow: 0 12px 38px rgba(0,0,0,0.24), inset 0 1px 0 rgba(255,255,255,0.22);
      cursor: pointer;
      transition: transform 220ms ease, opacity 220ms ease;
    }
    .open-btn:active { transform: scale(0.985); }
    .open-btn.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .fallback-tip {
      position: absolute;
      left: 50%;
      bottom: calc(env(safe-area-inset-bottom) + 22px);
      transform: translateX(-50%);
      z-index: 4;
      font-size: 13px;
      color: rgba(255,255,255,0.84);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(0,0,0,0.28);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 220ms ease;
    }
    .fallback-tip.show { opacity: 1; }
    .invitation { display: none; position: absolute; inset: 0; background: #071018; }
    .invitation.visible { display: block; }
    .pages {
      width: 100%;
      height: calc(var(--vh) * 100);
      overflow-y: auto;
      overflow-x: hidden;
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      background: #071018;
    }
    .pages::-webkit-scrollbar { display: none; }
    .page {
      position: relative;
      width: 100%;
      height: calc(var(--vh) * 100);
      scroll-snap-align: start;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      overflow: hidden;
      isolation: isolate;
      padding: max(28px, env(safe-area-inset-top) + 14px) 12px max(26px, env(safe-area-inset-bottom) + 12px);
      background: #08121c;
    }
    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: var(--bg);
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      z-index: -5;
      opacity: 1;
      transform: scale(1.025);
      transition: opacity 1000ms ease, filter 1300ms ease, transform 1300ms ease;
    }
    .page::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -4;
      background: linear-gradient(to bottom, rgba(7,16,25,0.12), rgba(7,16,25,0.22));
      transition: opacity 900ms ease;
    }
    .page.page-1::before {
      filter: blur(14px) saturate(0.9);
      transform: scale(1.06);
    }
    .page.page-1.reveal-bg::before {
      filter: blur(0px) saturate(1);
      transform: scale(1.025);
    }
    .content-shell {
      width: min(95vw, 1180px);
      display: flex;
      justify-content: center;
      margin-top: max(10px, env(safe-area-inset-top));
      z-index: 3;
    }
    .panel {
      position: relative;
      width: min(88vw, 1120px);
      min-height: 260px;
      padding: clamp(24px, 3vw, 38px) clamp(20px, 3.8vw, 58px);
      overflow: hidden;
      opacity: 0;
      transform: translateY(24px) scale(0.992);
      transition: opacity 820ms ease, transform 820ms ease;
    }
    .page.show-card .panel {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    .panel-rect {
      border-radius: 34px;
      background:
        radial-gradient(circle at top left, rgba(255,255,255,0.26), transparent 32%),
        radial-gradient(circle at bottom right, rgba(255,255,255,0.16), transparent 28%),
        linear-gradient(180deg, rgba(255,255,255,0.105), rgba(255,255,255,0.065));
      border: 1px solid rgba(255,255,255,0.52);
      box-shadow: var(--panel-shadow), inset 0 1px 0 rgba(255,255,255,0.36), inset 0 0 0 1px rgba(255,255,255,0.08);
      backdrop-filter: blur(3px) saturate(122%);
      -webkit-backdrop-filter: blur(3px) saturate(122%);
    }
    .panel-rect::before, .panel-rect::after {
      content: "";
      position: absolute;
      pointer-events: none;
      inset: 12px;
      border-radius: 26px;
    }
    .panel-rect::before {
      border: 1px solid rgba(255,255,255,0.2);
      box-shadow: inset 0 0 28px rgba(255,255,255,0.05);
    }
    .panel-rect::after {
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.16), transparent 28%, rgba(255,255,255,0.05) 54%, transparent 72%);
    }
    .panel-ornate {
      width: min(90vw, 1080px);
      min-height: 76vh;
      max-height: 80vh;
      padding: clamp(28px, 3.8vw, 44px) clamp(22px, 4vw, 54px);
      background: transparent;
    }
    .ornate-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      overflow: visible;
    }
    .ornate-fill {
      fill: rgba(255,255,255,0.125);
      stroke: rgba(255,255,255,0.62);
      stroke-width: 1.4;
      filter: drop-shadow(0 22px 58px rgba(8,18,31,0.16));
    }
    #page4 .ornate-fill { fill: rgba(255,255,255,0.13); }
    .ornate-highlight {
      fill: url(#ornateGloss);
      opacity: 0.82;
      mix-blend-mode: screen;
    }
    .ornate-inner {
      fill: none;
      stroke: rgba(255,255,255,0.22);
      stroke-width: 0.9;
    }
    #page4.details-focused .ornate-fill {
      fill: rgba(255,255,255,0.18);
      stroke: rgba(255,255,255,0.7);
    }
    #page4.details-focused .ornate-inner { stroke: rgba(255,255,255,0.3); }
    #page4.details-focused .ornate-highlight { opacity: 0.92; }
    .logo-splash {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 7;
      pointer-events: none;
      opacity: 0;
      transition: opacity 420ms ease;
    }
    .page.show-logo .logo-splash { opacity: 1; }
    .page.hide-logo .logo-splash { opacity: 0; }
    .logo-splash img {
      width: min(78vw, 510px);
      max-width: 510px;
      filter: drop-shadow(0 14px 34px rgba(0,0,0,0.28));
    }
    .typing, .calendar-appear, .time-scene, .venue-scene, .summary-scene, .closing-note {
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 620ms ease, transform 620ms ease;
    }
    .visible { opacity: 1 !important; transform: translateY(0) !important; }
    .hidden-out { opacity: 0 !important; transform: translateY(-8px) scale(0.985) !important; pointer-events: none; }
    .arabic, .subline, .hero-name, .date-line, .fancy-heading, .eng-title, .body-line, .big-name, .ampersand, .venue-name, .summary-line, .closing-note { text-align: center; }
    .arabic {
      margin: 0;
      direction: rtl;
      color: rgba(255,250,244,0.99);
      font-size: clamp(20px, 2.7vw, 31px);
      line-height: 1.38;
      letter-spacing: 0.015em;
    }
    .subline {
      margin: 0;
      font-size: clamp(12px, 1.55vw, 17px);
      line-height: 1.38;
      letter-spacing: 0.04em;
      color: rgba(255,248,239,0.95);
    }
    .hero-name {
      margin: 4px 0 0;
      font-family: "Brush Script MT", "Segoe Script", cursive;
      font-weight: 400;
      font-size: clamp(38px, 6vw, 78px);
      line-height: 1.04;
      text-shadow: var(--glow);
      color: rgba(255,248,236,0.99);
    }
    .date-line {
      margin: 2px 0 0;
      font-size: clamp(16px, 1.9vw, 23px);
      letter-spacing: 0.12em;
      color: rgba(255,248,241,0.98);
    }
    .stack-tight {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 100%;
    }
    .stack-tighter { gap: 5px; }
    .soft-gap { height: 8px; }
    .divider-mini {
      width: min(230px, 66%);
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(255,255,255,0.6), transparent);
      margin: 2px auto;
    }
    .fancy-heading {
      margin: 0;
      font-family: "Brush Script MT", "Segoe Script", cursive;
      font-size: clamp(29px, 3.7vw, 48px);
      line-height: 1.12;
      color: rgba(255,248,239,0.99);
      text-shadow: 0 0 12px rgba(255,245,223,0.14);
    }
    .eng-title {
      margin: 2px 0 0;
      font-size: clamp(13px, 1.8vw, 21px);
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: rgba(255,248,241,0.96);
    }
    .body-line {
      margin: 0;
      font-size: clamp(16px, 1.9vw, 22px);
      line-height: 1.55;
      color: rgba(255,248,241,0.985);
    }
    .big-name {
      margin: 0;
      font-family: "Brush Script MT", "Segoe Script", cursive;
      font-weight: 400;
      font-size: clamp(34px, 4.8vw, 60px);
      line-height: 1.08;
      color: rgba(255,248,236,0.99);
      text-shadow: var(--glow);
    }
    .ampersand { font-size: clamp(20px, 2.3vw, 28px); line-height: 1; margin: 2px 0; color: rgba(255,248,241,0.98); }
    .calendar-stage, .time-stage, .venue-stage {
      position: absolute;
      inset: clamp(24px, 3.8vw, 40px);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    .calendar-board {
      width: min(86%, 720px);
      max-width: 720px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: center;
      gap: 22px;
      color: rgba(255,250,243,0.99);
    }
    .calendar-month {
      align-self: flex-start;
      font-family: "Brush Script MT", "Segoe Script", cursive;
      font-size: clamp(34px, 4.6vw, 60px);
      line-height: 1;
      color: rgba(255,248,238,0.99);
      text-shadow: var(--glow);
      margin-left: 2%;
    }
    .calendar-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      align-items: center;
      justify-items: center;
      text-align: center;
    }
    .weekday, .datebox {
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 540ms ease, transform 540ms ease;
    }
    .weekday.show, .datebox.show, .year-mark.show, .heart-wrap.show { opacity: 1; transform: translateY(0); }
    .weekday {
      font-size: clamp(16px, 1.9vw, 24px);
      letter-spacing: 0.08em;
      color: rgba(255,248,241,0.96);
    }
    .datebox {
      position: relative;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 52px;
      font-size: clamp(24px, 3vw, 38px);
      color: rgba(255,248,241,0.99);
    }
    .datebox .num { position: relative; z-index: 2; }
    .heart-wrap {
      position: absolute;
      width: clamp(44px, 6.6vw, 70px);
      height: clamp(40px, 6.1vw, 62px);
      opacity: 0;
      transform: scale(0.94);
      transition: opacity 500ms ease, transform 500ms ease;
      pointer-events: none;
    }
    .heart-wrap.pulse { animation: pulseHeart 1.6s ease 1; }
    .heart-path {
      fill: none;
      stroke: rgba(255,248,241,0.96);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 220;
      stroke-dashoffset: 220;
      filter: drop-shadow(0 0 7px rgba(255,248,241,0.22));
    }
    .heart-wrap.draw .heart-path { animation: drawHeart 1.8s ease forwards; }
    .year-mark {
      align-self: flex-end;
      margin-right: 5%;
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      font-size: clamp(34px, 5vw, 66px);
      line-height: 1;
      opacity: 0;
      transform: translate(10px, 10px) rotate(-14deg);
      transition: opacity 720ms ease, transform 720ms ease;
      color: rgba(255,248,239,0.9);
    }
    .year-mark.show { transform: translate(0, 0) rotate(-14deg); }
    .time-stage { text-align: center; gap: 16px; }
    .time-title, .venue-title {
      margin: 0;
      font-family: "Brush Script MT", "Segoe Script", cursive;
      font-size: clamp(34px, 5vw, 64px);
      line-height: 1;
      text-shadow: var(--glow);
      color: rgba(255,248,238,0.99);
    }
    .time-value {
      font-size: clamp(24px, 3.5vw, 42px);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin: 0;
      color: rgba(255,248,241,0.98);
    }
    .venue-stage { justify-content: center; gap: 14px; padding-top: 4px; padding-bottom: 4px; }
    .venue-name { margin: 0; font-size: clamp(18px, 2.2vw, 26px); line-height: 1.35; color: rgba(255,248,241,0.985); }
    .map-frame {
      width: min(100%, 620px);
      height: min(28vh, 240px);
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.4);
      box-shadow: 0 14px 40px rgba(8,18,31,0.15), inset 0 1px 0 rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 620ms ease, transform 620ms ease;
    }
    .map-frame.visible { opacity: 1; transform: translateY(0); }
    .map-frame iframe { width: 100%; height: 100%; border: 0; display: block; }
    .summary-box {
      width: min(100%, 660px);
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
      text-align: center;
    }
    .summary-line { margin: 0; font-size: clamp(16px, 1.95vw, 22px); line-height: 1.42; color: rgba(255,248,241,0.985); }
    .direction-btn {
      appearance: none;
      border: 1px solid rgba(255,255,255,0.54);
      background: rgba(255,255,255,0.13);
      color: rgba(255,250,244,0.99);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 198px;
      min-height: 50px;
      padding: 12px 24px;
      border-radius: 999px;
      font-size: clamp(14px, 1.65vw, 18px);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      backdrop-filter: blur(10px) saturate(132%);
      -webkit-backdrop-filter: blur(10px) saturate(132%);
      box-shadow: 0 10px 28px rgba(0,0,0,0.18), inset 0 1px 0 rgba(255,255,255,0.2);
    }
    .closing-note {
      max-width: 680px;
      margin: 2px auto 0;
      font-size: clamp(15px, 1.85vw, 20px);
      line-height: 1.55;
      color: rgba(255,248,241,0.98);
    }
    @keyframes drawHeart { from { stroke-dashoffset: 220; } to { stroke-dashoffset: 0; } }
    @keyframes pulseHeart { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    @media (max-width: 980px) {
      .panel { width: min(92vw, 1100px); }
      .panel-ornate { width: min(92vw, 1040px); min-height: 78vh; max-height: 82vh; }
    }
    @media (max-width: 760px) {
      .open-wrap { top: 40%; width: min(88vw, 320px); }
      .open-btn { min-width: 210px; padding: 15px 28px; }
      .logo-splash img { width: min(82vw, 440px); }
      .panel { width: min(95vw, 920px); min-height: 300px; padding: 24px 18px; }
      .panel-ornate { width: min(95vw, 960px); min-height: 80vh; max-height: 84vh; padding: 26px 18px; }
      .stack-tight { gap: 7px; }
      .stack-tighter { gap: 4px; }
      .calendar-board { width: 92%; gap: 18px; }
      .map-frame { height: min(26vh, 220px); }
      .venue-stage { gap: 12px; }
    }
  </style>
</head>

  <script>
    (function () {
      const intro = document.getElementById('intro');
      const video = document.getElementById('introVideo');
      const audio = document.getElementById('bgAudio');
      const openBtn = document.getElementById('openBtn');
      const fallbackTip = document.getElementById('fallbackTip');
      const invitation = document.getElementById('invitation');
      const pagesWrap = document.getElementById('pages');
      const pageEls = [document.getElementById('page1'), document.getElementById('page2'), document.getElementById('page3'), document.getElementById('page4')];
      let started = false;
      let switched = false;
      let sequenceToken = 0;
      function setVH() {
        const vh = window.innerHeight * 0.01;
        document.documentElement.style.setProperty('--vh', vh + 'px');
      }
      setVH();
      window.addEventListener('resize', setVH, { passive: true });
      window.addEventListener('orientationchange', function () { setTimeout(setVH, 180); }, { passive: true });
      function wait(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }
      function decodeEntities(value) { return value.replace(/&amp;/g, '&').replace(/&#39;/g, "'"); }
      function clearTyping(page) { page.querySelectorAll('.typing').forEach(el => { el.innerHTML = ''; el.classList.remove('visible'); }); }
      function showEl(el) { if (el) el.classList.add('visible'); }
      function hideEl(el) { if (el) el.classList.add('hidden-out'); }
      function typeElement(el) {
        const text = decodeEntities(el.getAttribute('data-text') || '');
        const speed = el.classList.contains('arabic') ? 58 : el.classList.contains('hero-name') || el.classList.contains('big-name') ? 86 : 32;
        el.innerHTML = '';
        el.classList.add('visible');
        return new Promise(resolve => {
          let i = 0;
          function tick() {
            if (i <= text.length) {
              el.innerHTML = text.slice(0, i).replace(/\n/g, '<br>');
              i += 1;
              setTimeout(tick, speed);
            } else resolve();
          }
          tick();
        });
      }
      async function animateTyping(page) {
        const items = Array.from(page.querySelectorAll('.typing'));
        for (const item of items) {
          await typeElement(item);
          await wait(item.classList.contains('hero-name') || item.classList.contains('big-name') ? 240 : 130);
          if (sequenceToken === -1) return;
        }
      }
      async function animateCalendar(token) {
        const calendarStage = document.getElementById('calendarStage');
        const monthTitle = document.getElementById('monthTitle');
        const weekdays = Array.from(document.querySelectorAll('#weekdayRow .weekday'));
        const dateboxes = Array.from(document.querySelectorAll('#dateRow .datebox'));
        const heart = document.querySelector('.heart-wrap');
        const yearMark = document.getElementById('yearMark');
        calendarStage.classList.remove('hidden-out');
        showEl(calendarStage);
        await wait(320); if (token !== sequenceToken) return;
        showEl(monthTitle);
        await wait(860); if (token !== sequenceToken) return;
        for (const day of weekdays) { day.classList.add('show'); await wait(220); if (token !== sequenceToken) return; }
        for (const box of dateboxes) { box.classList.add('show'); await wait(260); if (token !== sequenceToken) return; }
        showEl(yearMark);
        await wait(620); if (token !== sequenceToken) return;
        heart.classList.add('show','draw');
        await wait(1900); if (token !== sequenceToken) return;
        heart.classList.add('pulse');
        await wait(1500); if (token !== sequenceToken) return;
        hideEl(calendarStage);
        await wait(760);
      }
      async function animatePage4(token) {
        const page = pageEls[3];
        const calendarStage = document.getElementById('calendarStage');
        const timeStage = document.getElementById('timeStage');
        const venueStage = document.getElementById('venueStage');
        const mapFrame = document.getElementById('mapFrame');
        const summaryBox = document.getElementById('summaryBox');
        const closingNote = document.getElementById('closingNote');
        page.classList.add('show-card');
        await wait(820); if (token !== sequenceToken) return;
        await animateCalendar(token); if (token !== sequenceToken) return;
        timeStage.classList.remove('hidden-out');
        showEl(timeStage);
        await wait(2550); if (token !== sequenceToken) return;
        hideEl(timeStage);
        await wait(760); if (token !== sequenceToken) return;
        venueStage.classList.remove('hidden-out');
        mapFrame.classList.remove('visible');
        summaryBox.classList.remove('visible');
        closingNote.classList.remove('visible');
        showEl(venueStage);
        await wait(540); if (token !== sequenceToken) return;
        showEl(mapFrame);
        await wait(640); if (token !== sequenceToken) return;
        showEl(summaryBox);
        await wait(640); if (token !== sequenceToken) return;
        showEl(closingNote);
        await wait(420); if (token !== sequenceToken) return;
        page.classList.add('details-focused');
      }
      async function animatePage(index, token) {
        if (token !== sequenceToken) return;
        const page = pageEls[index];
        if (!page) return;
        pagesWrap.scrollTo({ top: page.offsetTop, behavior: 'smooth' });
        clearTyping(page);
        if (index === 0) {
          page.classList.remove('hide-logo','show-card');
          page.classList.add('show-logo');
          await wait(1600); if (token !== sequenceToken) return;
          page.classList.add('reveal-bg');
          await wait(980); if (token !== sequenceToken) return;
          page.classList.add('hide-logo');
          await wait(260); if (token !== sequenceToken) return;
          page.classList.add('show-card');
          await wait(820); if (token !== sequenceToken) return;
          await animateTyping(page);
          await wait(1450); if (token !== sequenceToken) return;
          animatePage(1, token); return;
        }
        if (index === 1 || index === 2) {
          page.classList.add('show-card');
          await wait(820); if (token !== sequenceToken) return;
          await animateTyping(page);
          await wait(1600); if (token !== sequenceToken) return;
          animatePage(index + 1, token); return;
        }
        if (index === 3) await animatePage4(token);
      }
      function startInvitationSequence() { sequenceToken += 1; animatePage(0, sequenceToken); }
      function goToInvitation() {
        if (switched) return;
        switched = true;
        intro.classList.add('hidden');
        invitation.classList.add('visible');
        startInvitationSequence();
      }
      function startExperience() {
        if (started) return;
        started = true;
        fallbackTip.classList.remove('show');
        openBtn.classList.add('hidden');
        video.muted = true;
        video.playsInline = true;
        video.setAttribute('playsinline', '');
        video.setAttribute('webkit-playsinline', 'true');
        Promise.resolve(video.play()).then(function () {
          audio.currentTime = 0;
          Promise.resolve(audio.play()).catch(function () {});
        }).catch(function () {
          started = false;
          openBtn.classList.remove('hidden');
          fallbackTip.classList.add('show');
        });
      }
      video.addEventListener('ended', goToInvitation, { passive: true });
      video.addEventListener('timeupdate', function () {
        if (!switched && video.duration && video.currentTime >= video.duration - 0.05) goToInvitation();
      }, { passive: true });
      video.addEventListener('error', function () {
        if (!switched) {
          started = false;
          openBtn.classList.remove('hidden');
          fallbackTip.classList.add('show');
        }
      }, { passive: true });
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden && started && !switched && video.paused && !video.ended) {
          openBtn.classList.remove('hidden');
          fallbackTip.classList.add('show');
          started = false;
        }
      });
      openBtn.addEventListener('click', startExperience);
      openBtn.addEventListener('touchend', function (e) { e.preventDefault(); startExperience(); }, { passive: false });
    })();
  </script>
