<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wedding Event Scroll Experience — Prawin & Madhu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Italianno&family=Cinzel:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      overflow-x: hidden;
      background: #000;
      font-family: 'Cormorant Garamond', Georgia, serif;
      color: #fff;
    }

    body {
      scroll-behavior: smooth;
    }

    .section {
      position: relative;
      width: 100%;
      min-height: 100svh;
      overflow: hidden;
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
    }

    .full-screen {
      height: 100svh;
    }

    .section-1 {
      background-image: url('https://raw.githubusercontent.com/inviataorders/Prawin-Madhu/refs/heads/main/ig1.png');
    }

    .section-final {
      background-image: url('https://raw.githubusercontent.com/inviataorders/Prawin-Madhu/refs/heads/main/ig2.png');
    }

    .bg-section {
      background-image: url('https://raw.githubusercontent.com/inviataorders/Prawin-Madhu/refs/heads/main/bg.png');
      background-size: cover;
      background-position: center;
      background-repeat: repeat-y;
    }

    .cover-gif-wrap {
      width: 100%;
      height: 100svh;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .cover-gif {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .car {
      position: absolute;
      bottom: 0;
      pointer-events: none;
      user-select: none;
      will-change: transform, opacity;
      z-index: 3;
    }

    #car1 {
      left: 50%;
      width: min(108vw, 560px);
      transform: translate3d(-50%, 0, 0) scale(1);
      transform-origin: 50% 100%;
    }

    #car2 {
      right: -2vw;
      width: min(96vw, 580px);
      transform: translate3d(115vw, -18px, 0) scale(0.18) rotate(-3deg);
      transform-origin: 100% 100%;
      opacity: 0;
      will-change: transform, opacity;
    }

    #car2.car2-animate {
      animation: car2Arrive 3.4s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
    }

    @keyframes car2Arrive {
      0%   { transform: translate3d(115vw, -18px, 0) scale(0.18) rotate(-3deg); opacity: 0; }
      8%   { opacity: 1; }
      55%  { transform: translate3d(28vw, -8px, 0) scale(0.65) rotate(-1deg); opacity: 1; }
      100% { transform: translate3d(0, 0, 0) scale(1) rotate(0deg); opacity: 1; }
    }

    .car img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* =========================================================
       EVENT SCHEDULE  —  TIMELINE + NO WHITE, NO GOLD
       ========================================================= */

    .schedule-wrap {
      position: relative;
      width: 100%;
      padding: 60px 16px 48px;
    }

    .schedule-title {
      text-align: center;
      font-family: 'Italianno', 'Cormorant Garamond', cursive;
      font-weight: 400;
      font-style: normal;
      font-size: 78px;
      line-height: 0.95;
      margin: 4px auto 26px;
      color: #3a0e23;
      letter-spacing: 0.2px;
      text-shadow:
        0 2px 0 rgba(250, 240, 225, 0.65),
        0 0 32px rgba(250, 240, 225, 0.50),
        0 0 70px rgba(58, 14, 35, 0.30);
      position: relative;
    }

    .schedule-title::before {
      content: "RITUALS  ·  FUNCTIONS";
      display: block;
      font-family: 'Cinzel', serif;
      font-weight: 500;
      font-size: 10.5px;
      letter-spacing: 6.5px;
      color: rgba(58, 14, 35, 0.75);
      margin-bottom: 8px;
      text-shadow: 0 0 18px rgba(250, 240, 225, 0.55);
    }

    .schedule-title::after {
      content: "";
      display: block;
      width: 110px;
      height: 1px;
      margin: 14px auto 0;
      background: linear-gradient(90deg, transparent, rgba(58, 14, 35, 0.55), transparent);
    }

    .cards {
      display: flex;
      flex-direction: column;
      gap: 32px;
      width: 100%;
      max-width: 480px;
      margin: 28px auto 0;
      padding: 8px 0;
      position: relative;
    }

    .event-card {
      position: relative;
      width: 100%;
    }

    .event-image {
      position: relative;
      width: 100%;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(245, 230, 215, 0.32);
      background: rgba(58, 14, 35, 0.25);
      box-shadow:
        0 18px 34px rgba(0, 0, 0, 0.35),
        inset 0 0 0 1px rgba(245, 230, 215, 0.10);
      transition: transform 0.30s cubic-bezier(.22,.61,.36,1), box-shadow 0.30s ease;
    }
    .event-image img {
      display: block;
      width: 100%;
      height: auto;
    }
    .event-card:hover .event-image {
      transform: translateY(-2px);
      box-shadow:
        0 22px 40px rgba(0, 0, 0, 0.45),
        inset 0 0 0 1px rgba(245, 230, 215, 0.20);
    }

    /* Buttons  ·  DEEP MAROON + WINE GLASS (no gold, no white) */
    .btn-row {
      display: flex;
      flex-direction: row;
      gap: 10px;
      width: 100%;
      margin-top: 16px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 1 auto;
      min-height: 42px;
      padding: 11px 20px;
      border-radius: 999px;
      text-decoration: none;
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 600;
      font-size: 15px;
      line-height: 1;
      letter-spacing: 0.4px;
      transition: transform 0.25s cubic-bezier(.22,.61,.36,1),
                  box-shadow 0.25s ease,
                  background 0.25s ease,
                  filter 0.25s ease;
      text-align: center;
      white-space: nowrap;
      position: relative;
      overflow: hidden;
    }

    .btn svg {
      width: 15px;
      height: 15px;
      margin-right: 8px;
      fill: currentColor;
      flex: none;
      transition: transform 0.25s cubic-bezier(.22,.61,.36,1);
    }
    .btn:hover svg { transform: translateX(3px); }

    .btn:hover {
      transform: translateY(-2px);
    }
    .btn:active {
      transform: translateY(0) scale(0.97);
    }

    .btn-calendar {
      color: #faf3ea;
      background:
        linear-gradient(135deg, #5a1a36 0%, #7a244b 55%, #4d1430 100%);
      border: 1px solid rgba(245, 230, 215, 0.45);
      box-shadow:
        0 10px 22px rgba(35, 8, 22, 0.55),
        inset 0 1px 0 rgba(245, 230, 215, 0.22),
        inset 0 -1px 0 rgba(0, 0, 0, 0.30);
      letter-spacing: 0.6px;
    }
    .btn-calendar:hover {
      background:
        linear-gradient(135deg, #6b2043 0%, #8a2c56 55%, #5a1a36 100%);
      box-shadow:
        0 16px 32px rgba(35, 8, 22, 0.70),
        inset 0 1px 0 rgba(245, 230, 215, 0.30),
        inset 0 -1px 0 rgba(0, 0, 0, 0.30),
        0 0 24px rgba(122, 36, 75, 0.55);
    }

    .btn-directions {
      color: #faf3ea;
      background:
        linear-gradient(135deg, rgba(110, 50, 110, 0.40) 0%, rgba(70, 30, 90, 0.30) 100%);
      border: 1px solid rgba(245, 230, 215, 0.55);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow:
        0 10px 22px rgba(35, 10, 50, 0.45),
        inset 0 1px 0 rgba(245, 230, 215, 0.22);
    }
    .btn-directions:hover {
      background:
        linear-gradient(135deg, rgba(135, 65, 135, 0.50) 0%, rgba(85, 40, 100, 0.35) 100%);
      box-shadow:
        0 16px 32px rgba(35, 10, 50, 0.60),
        inset 0 1px 0 rgba(245, 230, 215, 0.30),
        0 0 24px rgba(160, 90, 160, 0.40);
    }

    @media (min-width: 768px) {
      .schedule-wrap {
        padding: 72px 28px 56px;
      }

      .schedule-title {
        font-size: 96px;
        margin-bottom: 32px;
        text-shadow:
          0 2px 0 rgba(250, 240, 225, 0.70),
          0 0 36px rgba(250, 240, 225, 0.55),
          0 0 78px rgba(58, 14, 35, 0.30);
      }
      .schedule-title::before { font-size: 12px; letter-spacing: 7.5px; }
      .schedule-title::after  { width: 140px; }

      .cards {
        max-width: 560px;
        gap: 38px;
        padding: 8px 0;
      }

      .btn {
        font-size: 16px;
        min-height: 46px;
        padding: 12px 24px;
      }
    }

    /* ====================================================== */
    /* FIRST INTERFACE : INTRO OVERLAY                         */
    /* ====================================================== */

    body.is-locked { overflow: hidden; height: 100svh; }

    .intro-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #2a0c1a;
      transition: opacity 0.95s ease, transform 0.95s cubic-bezier(.7,0,.3,1);
    }
    .intro-overlay.is-leaving {
      opacity: 0;
      transform: scale(1.06);
      pointer-events: none;
    }
    .intro-overlay.is-removed { display: none; }

    .intro-bg {
      position: absolute;
      inset: 0;
      background-image: url('https://raw.githubusercontent.com/inviataorders/Prawin-Madhu/refs/heads/main/bg.png');
      background-size: cover;
      background-position: center;
      animation: bgDrift 22s ease-in-out infinite alternate;
      filter: saturate(0.92);
    }
    .intro-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at center, rgba(42, 12, 26, 0.10) 30%, rgba(42, 12, 26, 0.65) 100%),
        linear-gradient(180deg, rgba(42, 12, 26, 0.40), rgba(42, 12, 26, 0.05) 35%, rgba(42, 12, 26, 0.70));
      pointer-events: none;
    }

    @keyframes bgDrift {
      0%   { transform: scale(1.08) translate3d(0, 0, 0); }
      100% { transform: scale(1.18) translate3d(-1.5%, -1%, 0); }
    }

    .intro-content {
      position: relative;
      z-index: 2;
      width: min(94%, 720px);
      text-align: center;
      padding: 22px 18px;
    }

    .intro-names {
      font-family: 'Italianno', cursive;
      font-weight: 400;
      color: #3a0e23;
      line-height: 0.95;
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      justify-content: center;
      gap: clamp(6px, 1.6vw, 18px);
      text-shadow:
        0 3px 0 rgba(250, 240, 225, 0.70),
        0 0 36px rgba(250, 240, 225, 0.55),
        0 0 72px rgba(58, 14, 35, 0.28);
      margin-bottom: 14px;
      max-width: 100%;
      overflow: visible;
    }
    .name-a, .name-b {
      font-size: clamp(56px, 11.5vw, 124px);
      display: inline-block;
      opacity: 0;
      white-space: nowrap;
      flex: 0 0 auto;
    }
    /* shrink on the very narrowest screens so the row fits without wrap */
    @media (max-width: 380px) {
      .name-a, .name-b { font-size: 48px; }
      .amp           { font-size: 38px; }
      .intro-names   { gap: 4px; }
    }
    @media (min-width: 381px) and (max-width: 480px) {
      .name-a, .name-b { font-size: 56px; }
      .amp           { font-size: 44px; }
      .intro-names   { gap: 6px; }
    }
    .name-a { animation: slideRight 1.15s 0.35s cubic-bezier(.2,.7,.2,1.05) forwards; }
    .name-b { animation: slideLeft  1.15s 0.35s cubic-bezier(.2,.7,.2,1.05) forwards; }
    .amp {
      font-size: clamp(42px, 8.5vw, 100px);
      color: #6b2148;
      opacity: 0;
      transform: scale(0.6);
      white-space: nowrap;
      flex: 0 0 auto;
      animation: ampPop 0.9s 1.35s cubic-bezier(.2,.7,.2,1.2) forwards;
      text-shadow:
        0 0 24px rgba(250, 240, 225, 0.55),
        0 0 48px rgba(58, 14, 35, 0.30);
    }

    .intro-sub {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 600;
      font-size: clamp(20px, 3.8vw, 30px);
      letter-spacing: 3px;
      color: #2a0612;
      opacity: 0;
      animation: fadeUp 0.9s 1.75s ease forwards;
      margin: 14px auto 0;
      padding: 9px 26px;
      display: inline-block;
      background:
        linear-gradient(135deg, rgba(250, 240, 225, 0.78) 0%, rgba(245, 225, 205, 0.62) 100%);
      border-radius: 999px;
      border: 1px solid rgba(58, 14, 35, 0.35);
      box-shadow:
        0 4px 14px rgba(35, 8, 22, 0.30),
        inset 0 1px 0 rgba(255, 255, 255, 0.55);
      text-shadow: 0 1px 0 rgba(250, 240, 225, 0.65);
    }

    .intro-divider {
      width: 130px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(58, 14, 35, 0.70), transparent);
      margin: 30px auto 0;
      opacity: 0;
      animation: fadeIn 0.8s 2.15s ease forwards;
    }

    /* ===== PLAY BUTTON  —  BYTE-IDENTICAL TO PREVIOUS ===== */
    .play-btn {
      --size: clamp(82px, 14vw, 110px);
      width: var(--size);
      height: var(--size);
      border-radius: 50%;
      border: none;
      cursor: pointer;
      margin: 30px auto 0;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 30% 25%, #fff7ea 0%, #f1c478 55%, #c98a3f 100%);
      box-shadow:
        0 18px 40px rgba(80, 35, 5, 0.55),
        inset 0 2px 0 rgba(255,255,255,0.55);
      position: relative;
      opacity: 0;
      animation:
        fadeUp 0.85s 2.4s ease forwards,
        playPulse 2.6s 3.2s ease-in-out infinite;
      transition: transform 0.25s ease;
    }
    .play-btn:hover { transform: scale(1.06); }
    .play-btn:active { transform: scale(0.95); }

    .play-btn::before {
      content: "";
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 1px solid rgba(255, 235, 215, 0.55);
      opacity: 0;
      animation: playRing 2.6s 3.2s ease-out infinite;
    }
    .play-btn::after {
      content: "";
      position: absolute;
      inset: -22px;
      border-radius: 50%;
      border: 1px solid rgba(255, 235, 215, 0.35);
      opacity: 0;
      animation: playRing 2.6s 3.65s ease-out infinite;
    }

    .play-btn svg {
      width: 38%;
      height: 38%;
      margin-left: 6%;
      fill: #3a1d05;
      filter: drop-shadow(0 1px 0 rgba(255,255,255,0.4));
    }
    /* ===== /PLAY BUTTON ===== */

    .hashtag {
      font-family: 'Cinzel', serif;
      font-weight: 500;
      font-size: clamp(15px, 2.6vw, 22px);
      letter-spacing: 9px;
      color: #faf3ea;
      text-transform: uppercase;
      margin-top: 22px;
      opacity: 0;
      animation: fadeUp 0.9s 3.2s ease forwards;
      text-shadow:
        0 2px 14px rgba(0, 0, 0, 0.55),
        0 0 26px rgba(58, 14, 35, 0.50);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn { to { opacity: 1; } }
    @keyframes slideRight {
      0%   { opacity: 0; transform: translateX(-70px) rotate(-3deg); }
      100% { opacity: 1; transform: translateX(0) rotate(0deg); }
    }
    @keyframes slideLeft {
      0%   { opacity: 0; transform: translateX(70px) rotate(3deg); }
      100% { opacity: 1; transform: translateX(0) rotate(0deg); }
    }
    @keyframes ampPop {
      0%   { opacity: 0; transform: scale(0.6); }
      70%  { opacity: 1; transform: scale(1.18); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes playPulse {
      0%, 100% { box-shadow: 0 18px 40px rgba(80,35,5,0.55), inset 0 2px 0 rgba(255,255,255,0.55), 0 0 0 0 rgba(255,200,160,0.0); }
      50%      { box-shadow: 0 18px 40px rgba(80,35,5,0.55), inset 0 2px 0 rgba(255,255,255,0.55), 0 0 0 18px rgba(255,200,160,0.0); }
    }
    @keyframes playRing {
      0%   { opacity: 0.7; transform: scale(0.85); }
      100% { opacity: 0;   transform: scale(1.5); }
    }

    @media (max-height: 640px) {
      .name-a, .name-b { font-size: clamp(56px, 10vw, 100px); }
      .play-btn { --size: 70px; margin-top: 18px; }
      .intro-divider { margin-top: 22px; }
    }
  </style>
</head>
<body>

  <!-- Background music for the wedding scroll experience -->
  <audio id="weddingAudio" preload="auto" loop>
    <source src="https://github.com/inviataorders/Vamsi-Roshni/raw/refs/heads/main/Vamsi.mp3" type="audio/mpeg">
  </audio>

  <!-- ============================================================ -->
  <!-- FIRST INTERFACE : INTRO OVERLAY                              -->
  <!-- ============================================================ -->
  <div class="intro-overlay" id="introOverlay" aria-label="Prawin and Madhu wedding invitation">
    <div class="intro-bg" aria-hidden="true"></div>
    <div class="intro-content">
      <div class="intro-names">
        <span class="name-a">Prawin</span>
        <span class="amp">&amp;</span>
        <span class="name-b">Madhu</span>
      </div>
      <div class="intro-sub">Are getting married</div>
      <div class="intro-divider"></div>

      <button type="button" class="play-btn" id="playBtn" aria-label="Open wedding invitation">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 5v14l11-7z"/>
        </svg>
      </button>

      <div class="hashtag">#MaWin</div>
    </div>
  </div>

  <!-- ============================================================ -->
  <!-- SECOND INTERFACE : EXISTING SECTIONS (UNCHANGED LAYOUT)      -->
  <!-- ============================================================ -->
  <section class="section section-1 full-screen" id="section1">
    <div class="car" id="car1">
      <img src="https://raw.githubusercontent.com/inviataorders/Prawin-Madhu/refs/heads/main/car1.1.png" alt="Car 1">
    </div>
  </section>

  <section class="section full-screen" id="coverSection">
    <div class="cover-gif-wrap">
      <img class="cover-gif" src="https://raw.githubusercontent.com/inviataorders/Prawin-Madhu/refs/heads/main/cover.gif" alt="Cover GIF">
    </div>
  </section>

  <section class="section bg-section" id="scheduleSection">
    <div class="schedule-wrap">
      <h2 class="schedule-title">Event Schedule</h2>

      <div class="cards">
        <div class="event-card">
          <div class="event-image">
            <img src="https://raw.githubusercontent.com/inviataorders/Prawin-Madhu/refs/heads/main/haldi.gif" alt="Event 1">
          </div>
          <div class="btn-row">
            <a class="btn btn-calendar" href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Event%201&dates=20260827/20260828" target="_blank" rel="noopener noreferrer">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2V2h-2v2H9V2H7zm-2 8h14v10H5V10zm2 2v2h2v-2H7zm4 0v2h2v-2h-2zm4 0v2h2v-2h-2z"/></svg>
              Add to calendar
            </a>
            <a class="btn btn-directions" href="https://share.google/OggHz1kuwaTxL138e" target="_blank" rel="noopener noreferrer">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
              Get directions
            </a>
          </div>
        </div>

        <div class="event-card">
          <div class="event-image">
            <img src="https://github.com/inviataorders/Prawin-Madhu/blob/main/Sangeet.gif?raw=true" alt="Event 2">
          </div>
          <div class="btn-row">
            <a class="btn btn-calendar" href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Event%202&dates=20260827/20260828" target="_blank" rel="noopener noreferrer">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2V2h-2v2H9V2H7zm-2 8h14v10H5V10zm2 2v2h2v-2H7zm4 0v2h2v-2h-2zm4 0v2h2v-2h-2z"/></svg>
              Add to calendar
            </a>
            <a class="btn btn-directions" href="https://maps.app.goo.gl/A9nKWwKHpk4y4a3DA?g_st=ic" target="_blank" rel="noopener noreferrer">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
              Get directions
            </a>
          </div>
        </div>

        <div class="event-card">
          <div class="event-image">
            <img src="https://github.com/inviataorders/Prawin-Madhu/blob/main/Rec.gif?raw=true" alt="Event 3">
          </div>

  <script>
    (function () {
      const section1     = document.getElementById('section1');
      const finalSection = document.getElementById('sectionFinal');
      const car1         = document.getElementById('car1');
      const car2         = document.getElementById('car2');

      const clamp         = (n, min, max) => Math.min(Math.max(n, min), max);
      const easeOutCubic  = t => 1 - Math.pow(1 - t, 3);

      function animateCars() {
        const vh = window.innerHeight;
        const vw = window.innerWidth;

        const rect1 = section1.getBoundingClientRect();
        const progress1 = clamp(-rect1.top / vh, 0, 1);
        const p1 = easeOutCubic(progress1);

        const car1X      = p1 * (vw * 1.08);
        const car1Y      = -p1 * 12;
        const car1Scale  = 1 - (p1 * 0.84);
        const car1Opacity = 1 - (p1 * 0.35);

        car1.style.transform = `translate3d(calc(-50% + ${car1X}px), ${car1Y}px, 0) scale(${car1Scale})`;
        car1.style.opacity = car1Opacity;
      }

      animateCars();
      window.addEventListener('scroll', animateCars, { passive: true });
      window.addEventListener('resize', animateCars);

      if ('IntersectionObserver' in window) {
        let car2Timer = null;
        const io = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              car2.classList.remove('car2-animate');
              void car2.offsetWidth;
              car2.classList.add('car2-animate');
            } else {
              car2Timer && clearTimeout(car2Timer);
              car2Timer = setTimeout(() => {
                car2.classList.remove('car2-animate');
              }, 600);
            }
          });
        }, { threshold: [0.5] });
        io.observe(finalSection);
      } else {
        const onScrollCar2 = () => {
          const rect = finalSection.getBoundingClientRect();
          const vh   = window.innerHeight;
          if (rect.top < vh * 0.5 && rect.bottom > vh * 0.5) {
            car2.classList.add('car2-animate');
          }
        };
        window.addEventListener('scroll', onScrollCar2, { passive: true });
      }

      const overlay = document.getElementById('introOverlay');
      const playBtn = document.getElementById('playBtn');
      const audio   = document.getElementById('weddingAudio');

      document.body.classList.add('is-locked');

      function dismissIntro() {
        if (!overlay || overlay.classList.contains('is-leaving')) return;

        try {
          audio.currentTime = 5;
          audio.volume = 1;
          const p = audio.play();
          if (p && typeof p.catch === 'function') p.catch(() => {});
        } catch (e) {}

        document.body.classList.remove('is-locked');
        overlay.classList.add('is-leaving');
        setTimeout(() => overlay.classList.add('is-removed'), 1000);
      }

      playBtn.addEventListener('click', dismissIntro);
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) dismissIntro();
      });

      document.addEventListener('visibilitychange', () => {
        if (!document.hidden && audio.paused && overlay.classList.contains('is-removed')) {
          try { audio.play().catch(() => {}); } catch (e) {}
        }
      });
    })();
  </script>
