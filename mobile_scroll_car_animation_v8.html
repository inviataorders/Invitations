<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wedding Event Scroll Experience</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      overflow-x: hidden;
      background: #000;
      font-family: Arial, sans-serif;
      color: #fff;
    }

    body {
      scroll-behavior: smooth;
    }

    .section {
      position: relative;
      width: 100%;
      min-height: 100svh;
      overflow: hidden;
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
    }

    .full-screen {
      height: 100svh;
    }

    .section-1 {
      background-image: url('https://raw.githubusercontent.com/inviataorders/Prawin-Madhu/refs/heads/main/ig1.png');
    }

    .section-final {
      background-image: url('https://raw.githubusercontent.com/inviataorders/Prawin-Madhu/refs/heads/main/ig2.png');
    }

    .bg-section {
      background-image: url('https://raw.githubusercontent.com/inviataorders/Prawin-Madhu/refs/heads/main/bg.png');
      background-size: cover;
      background-position: center;
      background-repeat: repeat-y;
    }

    .cover-gif-wrap {
      width: 100%;
      height: 100svh;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .cover-gif {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .car {
      position: absolute;
      bottom: 0;
      pointer-events: none;
      user-select: none;
      will-change: transform, opacity;
      z-index: 3;
    }

    #car1 {
      left: 50%;
      width: min(108vw, 560px);
      transform: translate3d(-50%, 0, 0) scale(1);
      transform-origin: 50% 100%;
    }

    #car2 {
      right: -2vw;
      width: min(96vw, 580px);
      transform: translate3d(120vw, 0, 0) scale(0.12);
      transform-origin: 100% 100%;
      opacity: 1;
    }

    .car img {
      display: block;
      width: 100%;
      height: auto;
    }

    .schedule-wrap {
      position: relative;
      width: 100%;
      padding: 44px 16px 40px;
    }

    .schedule-title {
      text-align: center;
      font-size: 34px;
      font-weight: 700;
      line-height: 1.15;
      margin-bottom: 28px;
      color: #fff;
      text-shadow: 0 2px 14px rgba(0,0,0,0.35);
    }

    .cards {
      display: flex;
      flex-direction: column;
      gap: 26px;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
    }

    .event-card {
      width: 100%;
    }

    .event-image {
      width: 100%;
      border-radius: 22px;
      overflow: hidden;
      border: 1.5px solid rgba(255,255,255,0.9);
      background: rgba(255,255,255,0.05);
      box-shadow: 0 14px 30px rgba(0,0,0,0.20);
    }

    .event-image img {
      display: block;
      width: 100%;
      height: auto;
    }

    .btn-row {
      display: flex;
      flex-direction: row;
      gap: 8px;
      width: 100%;
      margin-top: 12px;
      justify-content: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 1 auto;
      min-height: 38px;
      padding: 9px 14px;
      border-radius: 999px;
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.2px;
      transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease, filter 0.18s ease;
      text-align: center;
      white-space: nowrap;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.04);
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-calendar {
      color: #1d1303;
      background: linear-gradient(135deg, #fff8eb 0%, #efd39e 100%);
      border: 1px solid rgba(255,255,255,0.98);
      box-shadow: 0 8px 16px rgba(0,0,0,0.18), inset 0 1px 0 rgba(255,255,255,0.55);
    }

    .btn-directions {
      color: #fff;
      background: linear-gradient(135deg, rgba(255,255,255,0.24) 0%, rgba(255,255,255,0.10) 100%);
      border: 1px solid rgba(255,255,255,0.88);
      box-shadow: 0 8px 16px rgba(0,0,0,0.16), inset 0 1px 0 rgba(255,255,255,0.18);
    }

    @media (min-width: 768px) {
      .schedule-wrap {
        padding-left: 28px;
        padding-right: 28px;
      }

      .schedule-title {
        font-size: 40px;
      }

      .cards {
        max-width: 540px;
      }

      .btn {
        font-size: 13px;
        min-height: 40px;
        padding: 10px 16px;
      }
    }
  </style>
</head>
<body>
  <section class="section section-1 full-screen" id="section1">
    <div class="car" id="car1">
      <img src="https://raw.githubusercontent.com/inviataorders/Prawin-Madhu/refs/heads/main/car1.1.png" alt="Car 1">
    </div>
  </section>

  <section class="section full-screen" id="coverSection">
    <div class="cover-gif-wrap">
      <img class="cover-gif" src="https://raw.githubusercontent.com/inviataorders/Prawin-Madhu/refs/heads/main/cover.gif" alt="Cover GIF">
    </div>
  </section>

  <section class="section bg-section" id="scheduleSection">
    <div class="schedule-wrap">
      <h2 class="schedule-title">Event Schedule</h2>

      <div class="cards">
        <div class="event-card">
          <div class="event-image">
            <img src="https://raw.githubusercontent.com/inviataorders/Prawin-Madhu/refs/heads/main/haldi.gif" alt="Event 1">
          </div>
          <div class="btn-row">
            <a class="btn btn-calendar" href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Event%201&dates=20260827/20260828" target="_blank" rel="noopener noreferrer">Add to calendar</a>
            <a class="btn btn-directions" href="https://share.google/OggHz1kuwaTxL138e" target="_blank" rel="noopener noreferrer">Get directions</a>
          </div>
        </div>

        <div class="event-card">
          <div class="event-image">
            <img src="https://github.com/inviataorders/Prawin-Madhu/blob/main/Sangeet.gif?raw=true" alt="Event 2">
          </div>
          <div class="btn-row">
            <a class="btn btn-calendar" href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Event%202&dates=20260827/20260828" target="_blank" rel="noopener noreferrer">Add to calendar</a>
            <a class="btn btn-directions" href="https://maps.app.goo.gl/A9nKWwKHpk4y4a3DA?g_st=ic" target="_blank" rel="noopener noreferrer">Get directions</a>
          </div>
        </div>

        <div class="event-card">
          <div class="event-image">
            <img src="https://github.com/inviataorders/Prawin-Madhu/blob/main/Rec.gif?raw=true" alt="Event 3">
          </div>
          <div class="btn-row">
            <a class="btn btn-calendar" href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Event%203&dates=20260828/20260829" target="_blank" rel="noopener noreferrer">Add to calendar</a>
            <a class="btn btn-directions" href="https://share.google/DhRH6ELN8ewFMaEqT" target="_blank" rel="noopener noreferrer">Get directions</a>
          </div>
        </div>

        <div class="event-card">
          <div class="event-image">
            <img src="https://github.com/inviataorders/Prawin-Madhu/blob/main/muru.gif?raw=true" alt="Event 4">
          </div>
          <div class="btn-row">
            <a class="btn btn-calendar" href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Event%204&dates=20260828/20260829" target="_blank" rel="noopener noreferrer">Add to calendar</a>
            <a class="btn btn-directions" href="https://share.google/DhRH6ELN8ewFMaEqT" target="_blank" rel="noopener noreferrer">Get directions</a>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="section section-final full-screen" id="sectionFinal">
    <div class="car" id="car2">
      <img src="https://github.com/inviataorders/Prawin-Madhu/blob/main/car2.png?raw=true" alt="Car 2">
    </div>
  </section>

  <script>
    const section1 = document.getElementById('section1');
    const finalSection = document.getElementById('sectionFinal');
    const car1 = document.getElementById('car1');
    const car2 = document.getElementById('car2');

    const clamp = (num, min, max) => Math.min(Math.max(num, min), max);

    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    function animateCars() {
      const vh = window.innerHeight;
      const vw = window.innerWidth;

      const rect1 = section1.getBoundingClientRect();
      const progress1 = clamp(-rect1.top / vh, 0, 1);
      const p1 = easeOutCubic(progress1);

      const car1X = p1 * (vw * 1.08);
      const car1Y = -p1 * 12;
      const car1Scale = 1 - (p1 * 0.84);
      const car1Opacity = 1 - (p1 * 0.35);

      car1.style.transform = `translate3d(calc(-50% + ${car1X}px), ${car1Y}px, 0) scale(${car1Scale})`;
      car1.style.opacity = car1Opacity;

      const rect2 = finalSection.getBoundingClientRect();
      const triggerStart = vh * 0.98;
      const triggerRange = vh * 0.22;
      const progress2 = clamp((triggerStart - rect2.top) / triggerRange, 0, 1);
      const p2 = easeOutCubic(progress2);

      const startOffsetX = vw * 1.35;
      const moveX = startOffsetX * (1 - p2);
      const scale2 = 0.10 + (1.02 * p2);
      const lift2 = -12 * p2;
      const rotate2 = -4 + (4 * p2);

      car2.style.transform = `translate3d(${moveX}px, ${lift2}px, 0) scale(${scale2}) rotate(${rotate2}deg)`;
    }

    animateCars();
    window.addEventListener('scroll', animateCars, { passive: true });
    window.addEventListener('resize', animateCars);
  </script>
<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js/v4513226cdae34746b4dedf0b4dfa099e1781791509496" integrity="sha512-ZE9pZaUXND66v380QUtch/5sE9tPFh2zg45pR2PB0CVkCtOREv2AJKkSidISWkysEuQ0EH8faUU5du78bx87UQ==" data-cf-beacon='{"version":"2024.11.0","token":"4edd5f8ec12a48cfa682ab8261b80a79"}' crossorigin="anonymous"></script>
</body>
</html>
